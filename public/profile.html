<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h2>Dayflow HRMS</h2>
        </div>
        <div class="nav-links">
            <a href="#" id="dashboard-link">Dashboard</a>
        </div>
        <div class="nav-user">
            <span id="user-name">User</span>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Employee Profile</h1>
        
        <div id="error-message" class="error-message" style="display: none;"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>

        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-picture">
                    <img id="profile-img" src="https://via.placeholder.com/150" alt="Profile">
                </div>
                <h2 id="employee-name">Loading...</h2>
                <p id="employee-id">Employee ID: -</p>
            </div>

            <div class="profile-tabs">
                <button class="tab-btn active" onclick="showTab('personal')">Personal Details</button>
                <button class="tab-btn" onclick="showTab('job')">Job Details</button>
                <button class="tab-btn" onclick="showTab('salary')">Salary Structure</button>
            </div>

            <div id="personal-tab" class="tab-content active">
                <form id="personal-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" id="firstName" name="firstName">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="lastName" name="lastName">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" name="email" readonly>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea id="address" name="address" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="dateOfBirth" name="dateOfBirth">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Personal Details</button>
                </form>
            </div>

            <div id="job-tab" class="tab-content">
                <div class="info-display">
                    <div class="info-item">
                        <label>Department</label>
                        <p id="department">-</p>
                    </div>
                    <div class="info-item">
                        <label>Position</label>
                        <p id="position">-</p>
                    </div>
                    <div class="info-item">
                        <label>Joining Date</label>
                        <p id="joiningDate">-</p>
                    </div>
                    <div class="info-item">
                        <label>Employment Type</label>
                        <p id="employmentType">-</p>
                    </div>
                </div>
            </div>

            <div id="salary-tab" class="tab-content">
                <div class="info-display">
                    <div class="info-item">
                        <label>Base Salary</label>
                        <p id="baseSalary">-</p>
                    </div>
                    <div class="info-item">
                        <label>Allowances</label>
                        <p id="allowances">-</p>
                    </div>
                    <div class="info-item">
                        <label>Deductions</label>
                        <p id="deductions">-</p>
                    </div>
                    <div class="info-item">
                        <label>Currency</label>
                        <p id="currency">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        checkAuth();
        loadProfile();
    </script>
</body>
</html>
