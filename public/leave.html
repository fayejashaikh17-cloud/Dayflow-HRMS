<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Leave Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h2>Dayflow HRMS</h2>
        </div>
        <div class="nav-links">
            <a href="#" id="dashboard-link">Dashboard</a>
        </div>
        <div class="nav-user">
            <span id="user-name">User</span>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Leave Management</h1>

        <div id="error-message" class="error-message" style="display: none;"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>

        <div id="employee-section" style="display: none;">
            <div class="section-header">
                <h2>Apply for Leave</h2>
            </div>
            <form id="leave-form" class="leave-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="leaveType">Leave Type</label>
                        <select id="leaveType" name="leaveType" required>
                            <option value="paid">Paid Leave</option>
                            <option value="sick">Sick Leave</option>
                            <option value="unpaid">Unpaid Leave</option>
                            <option value="vacation">Vacation</option>
                            <option value="personal">Personal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="days">Days</label>
                        <input type="number" id="days" name="days" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" name="startDate" required onchange="calculateDays()">
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate" name="endDate" required onchange="calculateDays()">
                    </div>
                </div>
                <div class="form-group">
                    <label for="remarks">Remarks</label>
                    <textarea id="remarks" name="remarks" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Leave Request</button>
            </form>
        </div>

        <div class="section-header">
            <h2 id="leave-list-title">Leave Requests</h2>
        </div>
        <div class="leave-list" id="leave-list">
            <p>Loading...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        checkAuth();
        loadLeaveRequests();
        if (currentUser && currentUser.role === 'employee') {
            document.getElementById('employee-section').style.display = 'block';
        }
    </script>
</body>
</html>
